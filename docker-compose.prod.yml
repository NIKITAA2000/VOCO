# Секреты берутся из .env рядом с этим файлом (в git не хранится).
services:
  postgres:
    image: postgres:15
    container_name: voco-postgres
    restart: always
    environment:
      POSTGRES_USER: voco
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: voco_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voco -d voco_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  livekit:
    image: livekit/livekit-server:latest
    container_name: voco-livekit
    restart: always
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?}: ${LIVEKIT_API_SECRET:?}"
    ports:
      # 7880 (сигнализация) наружу не публикуется — ходит через nginx /livekit/
      - "7881:7881"
      - "50000-50060:50000-50060/udp"
    volumes:
      - ./livekit.prod.yaml:/etc/livekit.yaml:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voco-backend
    restart: always
    environment:
      PORT: 3001
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?}
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_PUBLIC_URL: wss://voco-meet.ru/livekit/
      CORS_ORIGIN: https://voco-meet.ru
      DATABASE_URL: postgresql://voco:${POSTGRES_PASSWORD:?}@postgres:5432/voco_db
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: voco-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - backend

  certbot:
    image: certbot/certbot
    container_name: voco-certbot
    profiles: ["tools"]
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

volumes:
  postgres_data:
  uploads_data:
